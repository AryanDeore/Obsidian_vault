<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa" rx="10" ry="10" />
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">Git Branch Management: Feature Branch Update Process</text>
  
  <!-- Main branch timeline -->
  <line x1="100" y1="100" x2="700" y2="100" stroke="#0366d6" stroke-width="4" />
  <text x="50" y="105" font-family="Arial" font-size="16" font-weight="bold" fill="#0366d6">main</text>
  
  <!-- Feature branch timeline -->
  <line x1="200" y1="100" x2="250" y2="150" stroke="#28a745" stroke-width="2" />
  <line x1="250" y1="150" x2="500" y2="150" stroke="#28a745" stroke-width="4" />
  <text x="50" y="155" font-family="Arial" font-size="16" font-weight="bold" fill="#28a745">feature</text>
  
  <!-- Remote feature branch timeline -->
  <line x1="200" y1="100" x2="250" y2="200" stroke="#6f42c1" stroke-width="2" />
  <line x1="250" y1="200" x2="500" y2="200" stroke="#6f42c1" stroke-width="4" />
  <text x="50" y="205" font-family="Arial" font-size="16" font-weight="bold" fill="#6f42c1">remote/feature</text>
  
  <!-- The merge process -->
  <line x1="500" y1="150" x2="550" y2="200" stroke="#28a745" stroke-width="2" stroke-dasharray="5,5" />
  <line x1="550" y1="200" x2="600" y2="200" stroke="#6f42c1" stroke-width="4" />
  
  <!-- Main branch commits -->
  <circle cx="200" cy="100" r="8" fill="#0366d6" />
  <circle cx="300" cy="100" r="8" fill="#0366d6" />
  <circle cx="400" cy="100" r="8" fill="#0366d6" />
  <circle cx="500" cy="100" r="8" fill="#0366d6" />
  
  <!-- Feature branch commits -->
  <circle cx="250" cy="150" r="6" fill="#28a745" />
  <circle cx="300" cy="150" r="6" fill="#28a745" />
  <circle cx="350" cy="150" r="6" fill="#28a745" />
  <circle cx="400" cy="150" r="6" fill="#28a745" />
  <circle cx="450" cy="150" r="6" fill="#28a745" />
  <circle cx="500" cy="150" r="6" fill="#28a745" />
  
  <!-- Remote feature branch commits -->
  <circle cx="250" cy="200" r="6" fill="#6f42c1" />
  <circle cx="300" cy="200" r="6" fill="#6f42c1" />
  <circle cx="350" cy="200" r="6" fill="#6f42c1" />
  <circle cx="400" cy="200" r="6" fill="#6f42c1" />
  <circle cx="450" cy="200" r="6" fill="#6f42c1" />
  <circle cx="500" cy="200" r="6" fill="#6f42c1" />
  
  <!-- Final updated branch -->
  <line x1="500" y1="100" x2="550" y2="250" stroke="#0366d6" stroke-width="2" />
  <line x1="550" y1="250" x2="700" y2="250" stroke="#ff9900" stroke-width="4" />
  <text x="50" y="255" font-family="Arial" font-size="16" font-weight="bold" fill="#ff9900">updated feature</text>
  
  <!-- Merged commits -->
  <circle cx="550" cy="250" r="8" fill="#ff9900" />
  <circle cx="600" cy="250" r="8" fill="#ff9900" />
  <circle cx="650" cy="250" r="8" fill="#ff9900" />
  <circle cx="700" cy="250" r="8" fill="#ff9900" />
  
  <!-- Steps -->
  <rect x="50" y="280" width="700" height="100" fill="white" rx="5" ry="5" stroke="#ddd" stroke-width="1" />
  
  <text x="60" y="305" font-family="Arial" font-size="14" font-weight="bold">1. Initial State: Feature branch 4 commits behind main, divergent histories with remote</text>
  <text x="60" y="335" font-family="Arial" font-size="14" font-weight="bold">2. Solution: Reset local branch to match remote → git reset --hard origin/feature</text>
  <text x="60" y="365" font-family="Arial" font-size="14" font-weight="bold">3. Update with main changes → git merge main</text>
  <text x="60" y="395" font-family="Arial" font-size="14" font-weight="bold">4. Result: Feature branch up-to-date with main (0 behind, 7 ahead)</text>
</svg>
